<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha - GeoConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>

<body>

    <main class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-sm p-4" style="max-width: 450px; width: 100%;">

            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill fs-1"></i>
                <h2 class="mt-3">Redefinir senha</h2>
                <p class="text-muted">Digite sua nova senha abaixo.</p>
            </div>

            <form id="form-redefinir-senha">

                <div class="mb-3">
                    <label for="novaSenha" class="form-label">Nova senha</label>
                    <input
                        type="password"
                        class="form-control"
                        id="novaSenha"
                        placeholder="Digite sua nova senha"
                        minlength="6"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="confirmarSenha" class="form-label">Confirmar nova senha</label>
                    <input
                        type="password"
                        class="form-control"
                        id="confirmarSenha"
                        placeholder="Digite novamente sua nova senha"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary w-100" id="btn-redefinir">
                    Redefinir senha
                </button>

            </form>

            <div id="mensagem" class="mt-3" role="alert" style="display: none;"></div>

            <div class="text-center mt-4">
                <a href="login.html" class="text-decoration-none">
                    <i class="bi bi-arrow-left"></i>
                    Voltar para o login
                </a>
            </div>

        </div>
    </main>

    <script src="redefinir_senha.js"></script>

</body>

</html>
