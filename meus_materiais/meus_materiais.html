<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Materiais</title>

    <link rel="shortcut icon" href="../assests/img/favicon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/assests/reutilizaveis/sidebar.css">
</head>
<body>
   <div class="d-flex">

        <div id="sidebar-placeholder"></div>

        <main class="content p-4 w-100">

            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a href="../index/index.html">Início</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">
                        Materiais
                    </li>
                </ol>
            </nav>

            <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-3">
                <div>
                    <h2 class="titulo">Meus Materiais</h2>
                    <p class="subtitulo">
                        Seus materiais aprovados disponíveis para você.
                    </p>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                <span class="contadorFavoritos">
                    <i class="bi bi-folder2-open"></i>
                    <span id="qtd-materiais">0</span> materiais aprovados
                </span>

                <div class="d-flex gap-2">

                    <div class="barra-pesquisa">
                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>

                        <input
                            type="text"
                            id="pesquisa"
                            class="form-control"
                            placeholder="Buscar nos meus materiais..."
                        >
                    </div>

                    <button type="button" class="ordenar">
                        <i class="bi bi-sort-down"></i>
                        Ordenar
                    </button>

                </div>
            </div>

            <div class="row g-4">

                <div class="col-lg-8">
                    <div class="listaMateriais" id="listaMateriais">

                        <div class="mensagem-sem-materiais text-center py-5">
                            <i class="bi bi-folder-x fs-1 text-secondary"></i>
                            <h5 class="mt-3">Nenhum material aprovado</h5>
                            <p class="text-secondary mb-0">
                                Os seus materiais aprovados aparecerão aqui.
                            </p>
                        </div>

                    </div>
                </div>

                <div class="col-lg-4 d-flex flex-column gap-3">
    
                    <div class="card painel-filtros p-3">
                        <div class="d-flex align-items-center gap-2 mb-3 fw-bold" style="color: var(--verde-escuro);">
                            <i class="bi bi-funnel"></i>
                            <span>Filtros</span>
                        </div>

                        <div class="mb-3">
                            <label class="label-filtro">Disciplinas</label>
                            <select class="select-filtro" id="filtro-disciplina">
                                <option value="" selected>Todas as disciplinas</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="label-filtro">Tipo de material</label>
                            <select class="select-filtro" id="filtro-tipo">
                                <option value="" selected>Todos os tipos</option>
                                <option value="PDF">PDF</option>
                                <option value="PPTX">PPTX</option>
                                <option value="MP4">MP4</option>
                            </select>
                        </div>

                        
   </div>
   <script src="/assests/reutilizaveis/sidebar.js"></script>        
</body>
</html>
