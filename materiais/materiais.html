<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Materiais </title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="../assests/img/favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="/assests/reutilizaveis/sidebar.css">

    <link rel="stylesheet" href="materiais.css">
</head>
<body>
    
    <div class="d-flex">
        <div id="sidebar-placeholder"></div>

        <main class="content p-4 w-100">

            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-3">
                    <li class="breadcrumb-item"><a href="../index/index.html">Início</a></li>
                    <li class="breadcrumb-item"><a href="../disciplinas/disciplinas.html">Disciplinas</a></li>
                    <li class="breadcrumb-item active" id="breadcrumb-disciplina" aria-current="page">...</li>
                </ol>
            </nav>

            <div class="banner-disciplina p-4 mb-4 d-flex align-items-center gap-3">
                <div class="icone-disciplina">
                    <i class="bi bi-diamond"></i>
                </div>
                <div>
                    <h2 class="titulo-disciplina mb-1" id="disciplina-nome">Carregando...</h2>
                    <p class="subtitulo-disciplina mb-0" id="disciplina-descricao">Buscando informações da disciplina...</p>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-3">
                <div class="barra-pesquisa">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" id="pesquisa-material" class="form-control" placeholder="Buscar materiais...">
                </div>

                <div class="filtro-tipo">
                    <select class="form-select" id="select-tipo-material">
                        <option value="" selected>Todos os tipos</option>
                        <option value="PDF">PDF</option>
                        <option value="PPTX">slides</option>
                        <option value="IMG">IMG</option>
                    </select>
                </div>
            </div>
            <p class="text-muted small mb-3">
                <span id="total-materiais">0</span> materiais encontrados
            </p>

            <div id="container-materiais" class="d-flex flex-column gap-3 mb-4">
                
                <div class="mensagem-sem-materiais text-center py-5">
                    <i class="bi bi-folder-x fs-1 text-secondary"></i>
                    <h5 class="mt-3">Nenhum material cadastrado</h5>
                    <p class="text-secondary mb-0">
                        Os materiais cadastrados nesta disciplina aparecerão aqui.
                    </p>
                </div>

            </div>

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 pt-2">
                <span class="text-muted small" id="info-paginacao">Mostrando 0 a 0 de 0 materiais</span>
                
                <nav aria-label="Navegação de página">
                    <ul class="pagination pagination-sm mb-0" id="paginacao">
                        </ul>
                </nav>
            </div>

        </main>
    </div>

    <script src="/assests/reutilizaveis/sidebar.js"></script>

</body>
</html>
