<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoConnect - Cadastro</title>

    <link rel="shortcut icon" href="../assests/img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="cadastro.css">
</head>
<body class="auth-body">

    <main class="auth-container">
        <!-- Lado esquerdo / Header da marca -->
        <div class="auth-header">
            <h1>GeoConnect</h1>
            <p>Crie sua conta para acessar os materiais didáticos, práticas e conteúdos do Campus Parelhas.</p>
        </div>

        <!-- Card com o formulário -->
        <div class="auth-card">
            <div class="auth-card-header">
                <h2>Cadastrar-se</h2>
                <p>Preencha os campos abaixo para criar seu acesso</p>
            </div>

            <form id="form-cadastro" class="auth-form">
                <!-- Nome Completo -->
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-person"></i>
                        <input type="text" id="nome" name="nome" placeholder="Ex: João da Silva" required>
                    </div>
                </div>

                <!-- E-mail Institucional -->
                <div class="form-group">
                    <label for="email">E-mail Institucional</label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="seu.email@escolar.ifrn.edu.br" required>
                    </div>
                </div>

                <!-- Senha -->
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="senha" name="senha" placeholder="••••••••" minlength="6" required>
                    </div>
                </div>

                <!-- Confirmar Senha -->
                <div class="form-group">
                    <label for="confirmar-senha">Confirmar Senha</label>
                    <input-icon-wrapper class="input-icon-wrapper">
                        <i class="bi bi-shield-lock"></i>
                        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="••••••••" minlength="6" required>
                    </input-icon-wrapper>
                </div>

                <!-- Botão de Ação -->
                <button type="submit" class="btn-primary btn-auth">
                    <span>Criar Minha Conta</span>
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <!-- Rodapé / Navegação para Login -->
            <div class="auth-footer">
                <p>Já possui uma conta? <a href="login.html">Fazer login</a></p>
            </div>
        </div>
    </main>
    
</body>
</html>
