<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="../assests/img/favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="/assests/reutilizaveis/sidebar.css">

    <link rel="stylesheet" href="favoritos.css">
</head>
<body>
    <div class="d-flex">

        <!-- SIDEBAR -->
        <div id="sidebar-placeholder"></div>
        <!-- CABEÇALHO -->
        <main class="content p-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a href="/index.html">Início</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">
                        Favoritos
                    </li>
                </ol>
            </nav>

            <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-3">

                <div>
                    <h2 class="titulo">
                        Favoritos
                    </h2>
                    <p class="subtitulo">
                        Materiais salvos para você acessar quando quiser.
                    </p>

                </div>

            </div>
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                <!-- CONTADOR -->
                <span class="contadorFavoritos">
                    <i class="bi bi-star"></i>
                    0 materiais favoritos
                </span>

                <!-- AÇÕES -->
                <div class="d-flex gap-2">

                    <!-- PESQUISA -->
                    <div class="barra-pesquisa">
                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>

                        <input
                            type="text"
                            id="pesquisa"
                            class="form-control"
                            placeholder="Buscar nos favoritos..."
                        >
                    </div>

                </div>

            </div>

            <div class="row g-4">

                <div class="col-lg-8">
                    <!-- lista de favoritos -->
                    <div class="listaFavoritos">

                        <div class="mensagem-sem-favoritos text-center py-5">

                            <i class="bi bi-star fs-1 text-secondary"></i>

                            <h5 class="mt-3">
                                Nenhum material favorito
                            </h5>

                            <p class="text-secondary mb-0">
                                Os materiais que você favoritar aparecerão aqui.
                            </p>

                        </div>

                    </div>
                </div>

                <div class="col-lg-4 d-flex flex-column gap-3">
    
                    <div class="card painel-filtros p-3">
                        <div class="d-flex align-items-center gap-2 mb-3 fw-bold" style="color: var(--verde-escuro);">
                            <i class="bi bi-funnel"></i>
                            <span>Filtros</span>
                        </div>

                        <div class="mb-3">
                            <label class="label-filtro">Disciplinas</label>
                            <select class="select-filtro" id="filtro-disciplina">
                                <option value="" selected>Todas as disciplinas</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="label-filtro">Tipo de material</label>
                            <select class="select-filtro" id="filtro-tipo">
                                <option value="" selected>Todos os tipos</option>
                            </select>
                        </div>

                        <button type="button" id="limpar-filtros" class="btn btn-link text-decoration-none p-0 border-0 small w-100 text-center" style="color: var(--verde-escuro); font-weight: 500;">
                            <i class="bi bi-arrow-counterclockwise"></i> Limpar filtros
                        </button>
                    </div>

                 </div>

        </main>
    </div>


    <script src="/assests/reutilizaveis/sidebar.js"></script>
    <script src="favoritos.js"></script>
</body>
</html>
