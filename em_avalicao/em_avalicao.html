<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materiais em avaliação</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="../assests/img/favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="/assests/reutilizaveis/sidebar.css">
</head>
<body>
    <div class="d-flex">
        <div id="sidebar-placeholder"></div>

        <!-- CABEÇALHO -->
        <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-3">

            <div>

                <h2 class="pagina-titulo">
                    Materiais em avaliação
                </h2>

                <p class="pagina-subtitulo">
                    Acompanhe o status dos materiais enviados para avaliação.
                </p>

            </div>

            <!-- BUSCA E FILTRO -->
            <div class="d-flex gap-2 align-items-center">

                <div class="campo-busca">

                    <i class="bi bi-search busca-icone"></i>

                    <input
                        type="text"
                        class="busca-input"
                        placeholder="Buscar materiais..."
                    >

                </div>

                <button
                    type="button"
                    class="btn-filtrar"
                >
                    <i class="bi bi-funnel"></i>
                    Filtrar
                </button>

            </div>
        </div>
    </div>
    <script src="/assests/reutilizaveis/sidebar.js"></script>
</body>
</html>
