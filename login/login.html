<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Geoconect - Login</title>

    <link rel="stylesheet" href="login.css">
    <link rel="shortcut icon" href="../assests/img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer>
    </script>
</head>

<body>

    <div class="conteinerPrincipal">

        <div class="conteinerEsquerdo">

            <h1>Geoconect</h1>

            <p>
                Uma plataforma educacional para o ensino das Geociências.
            </p>

        </div>


        <div class="conteinerDireito">

            <div class="conteinerLogin">

                <h2>Login</h2>


                <!-- MENSAGEM -->
                <div
                    id="mensagem-login"
                    class="mensagem">
                </div>


                <!-- ===================================== -->
                <!-- LOGIN NORMAL -->
                <!-- ===================================== -->

                <form id="form-login">

                    <div class="campo">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            required>

                    </div>


                    <div class="campo">

                        <label for="senha">
                            Senha
                        </label>

                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                        
                         <button type="button" id="toggleSenha" class="botao-olho">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>


                    <button
                        type="submit"
                        id="btn-login">

                        Entrar

                    </button>

                </form>


                <!-- ===================================== -->
                <!-- ESQUECI A SENHA -->
                <!-- ===================================== -->

                <div class="recuperar-senha">

                    <a href="../login/esqueci_senha.html">
                        Esqueci minha senha
                    </a>

                </div>
                
            
                <!--div de fazer cadastro novo-->
                <div class="cadastroLinha">
                    Novo por aqui? <a href="../cadastro/cadastro.html">Cadastrar-se</a>

                </div>

                <div
                    id="g_id_onload"
                    data-client_id="102302103057-v175sj9qktdd2p09qhfv0koaj9bkj0a3.apps.googleusercontent.com"
                    data-callback="handleCredentialResponse"
                    data-auto_prompt="false">
                </div>


                <div
                    class="g_id_signin"
                    data-type="standard"
                    data-size="large"
                    data-theme="outline"
                    data-text="signin_with"
                    data-shape="rectangular"
                    data-logo_alignment="left">
                </div>


            </div>

        </div>

    </div>


    <script src="login.js"></script>

</body>
</html>
