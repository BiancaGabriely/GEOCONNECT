<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Geoconect - Login</title>

    <link rel="stylesheet" href="login.css">
    <link rel="shortcut icon" href="../assests/img/favicon.png" type="image/x-icon">

    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer>
    </script>
</head>

<body>

    <div class="conteinerPrincipal">

        <div class="conteinerEsquerdo">
            <h1>Geoconect</h1>

            <p>
                Uma plataforma educacional para o ensino das Geociências.
            </p>
        </div>


        <div class="conteinerDireito">

            <div class="conteinerLogin">

                <h2>Login</h2>

                <div
                    id="mensagem-login"
                    class="mensagem">
                </div>

                <div
                    id="g_id_onload"
                    data-client_id="102302103057-v175sj9qktdd2p09qhfv0koaj9bkj0a3.apps.googleusercontent.com"
                    data-callback="handleCredentialResponse"
                    data-auto_prompt="false">
                </div>

                <div
                    class="g_id_signin"
                    data-type="standard"
                    data-size="large"
                    data-theme="outline"
                    data-text="signin_with"
                    data-shape="rectangular"
                    data-logo_alignment="left">
                </div>

            </div>

        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
