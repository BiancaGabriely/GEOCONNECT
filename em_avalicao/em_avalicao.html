<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materiais em avaliação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="../assests/img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="/assests/reutilizaveis/sidebar.css">
    <link rel="stylesheet" href="em_avalicao.css">
</head>
<body>
    <div class="d-flex">
        <div id="sidebar-placeholder"></div>

        <main class="content p-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a href="../index/index.html">Início</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">
                        Materiais em avaliação
                    </li>
                </ol>
            </nav>

            <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-3">
                <div>
                    <h2 class="titulo">Materiais em avaliação</h2>
                    <p class="subtitulo">Acompanhe o status dos materiais enviados para avaliação.</p>
                </div>

                <div class="d-flex gap-2 align-items-center">
                    <div class="barra-pesquisa">
                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" id="pesquisa" class="form-control" placeholder="Buscar materiais...">
                    </div>

                    <button type="button" class="filtrar">
                        <i class="bi bi-funnel"></i>
                        Filtrar
                    </button>
                </div>
            </div>

            <div class="row row-cols-1 row-cols-md-3 row-cols-lg-5 g-3 mb-4">
                <div class="col">
                    <div class="card">
                        <div class="card-body">
                            <i class="bi bi-list"></i>
                            <span>Todos</span>
                            <strong>0</strong>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="card">
                        <div class="card-body">
                            <i class="bi bi-clock"></i>
                            <span>Em análise</span>
                            <strong>0</strong>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="card">
                        <div class="card-body">
                            <i class="bi bi-exclamation-circle"></i>
                            <span>Aguardando ajustes</span>
                            <strong>0</strong>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="card">
                        <div class="card-body">
                            <i class="bi bi-check-circle"></i>
                            <span>Aprovados</span>
                            <strong>0</strong>
                        </div>
                    </div>
                </div>

                <div class="col">
                    <div class="card">
                        <div class="card-body">
                            <i class="bi bi-x-circle"></i>
                            <span>Rejeitados</span>
                            <strong>0</strong>
                        </div>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Material</th>
                            <th>Disciplina</th>
                            <th>Palavras-chave</th>
                            <th>Enviado em</th>
                            <th>Status</th>
                            <th id="th-acoes">Ações</th>
                        </tr>
                    </thead>

                    <tbody id="lista-materiais">
                        <tr>
                            <td colspan="6" class="text-center py-5">
                                <i class="bi bi-inbox fs-1 text-secondary"></i>
                                <p class="mt-3 mb-1 fw-semibold">Carregando materiais...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-3">
                <small id="contador-materiais" class="text-secondary">
                    Carregando materiais...
                </small>

                <nav aria-label="Paginação">
                    <ul class="pagination mb-0">
                        <li class="page-item disabled">
                            <button class="page-link" type="button">
                                <i class="bi bi-chevron-left"></i>
                            </button>
                        </li>
                        <li class="page-item disabled">
                            <button class="page-link" type="button">1</button>
                        </li>
                        <li class="page-item disabled">
                            <button class="page-link" type="button">
                                <i class="bi bi-chevron-right"></i>
                            </button>
                        </li>
                    </ul>
                </nav>
            </div>
        </main>
    </div>

    <script src="/assests/reutilizaveis/sidebar.js"></script>
    <script src="em_avalicao.js"></script>
</body>
</html>
