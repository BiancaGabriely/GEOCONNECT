<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Disciplina</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assests/reutilizaveis/sidebar.css">
    <link rel="stylesheet" href="criar_disciplinas.css">
    <link rel="shortcut icon" href="../assests/img/favicon.png" type="image/x-icon">
</head>
<body>
    <div class="d-flex">
        <!-- SIDEBAR -->
        <div id="sidebar-placeholder"></div> 

    </div>


    <main class="content p-4">
        <h1>Cadastrar Disciplina</h1>

        <form id="form-disciplina">
            <!-- Campos do formulário -->
            <label for="nome">Nome da disciplina:</label>
            <input type="text" id="nome" name="nome" required>
            <button type="submit">Cadastrar</button>
        </form>
        <div id="mensagem"></div>
    </main>
    <script src="/assests/reutilizaveis/sidebar.js"></script>
    <script src="criar_disciplina.js"></script>
</body>
</html>
